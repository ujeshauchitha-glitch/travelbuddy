<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Tinder</title>
    <script>
      // Apply saved look-and-feel before first paint, so there is no flash of the default.
      try {
        var r = document.documentElement, p = JSON.parse(localStorage.getItem('tt-prefs') || 'null');
        if (p) {
          var map = { palette: 'palette', texture: 'texture', edge: 'edge', line: 'line', corners: 'corners', density: 'density', size: 'fs', motion: 'motion', art: 'art', cursor: 'cursor' };
          for (var k in map) if (typeof p[k] === 'string') r.setAttribute('data-' + map[k], p[k]);
          if (typeof p.fx === 'boolean') r.setAttribute('data-fx', p.fx ? 'on' : 'off');
          if (typeof p.doodles === 'boolean') r.setAttribute('data-doodles', p.doodles ? 'on' : 'off');
          if (p.theme === 'light' || p.theme === 'dark') r.setAttribute('data-theme', p.theme);
        } else {
          var t = localStorage.getItem('tb-theme');
          if (t === 'light' || t === 'dark') r.setAttribute('data-theme', t);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
